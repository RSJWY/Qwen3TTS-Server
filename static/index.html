<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3-TTS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --primary:#58a6ff;--primary-dim:#1f6feb;--accent:#f78166;
  --text:#c9d1d9;--text-bright:#f0f6fc;--text-muted:#8b949e;
  --radius:6px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
#app{display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:15px;font-weight:600;color:var(--text-bright)}
header .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
header .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
header .dot.ok{background:#3fb950}
header .dot.loading{background:#d29922;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

main{display:flex;flex:1;overflow:hidden}
nav{width:220px;border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;overflow-y:auto}
nav button{display:block;width:100%;text-align:left;padding:8px 16px;background:none;border:none;color:var(--text);font-size:13px;cursor:pointer;border-left:2px solid transparent}
nav button:hover{background:rgba(255,255,255,.04);color:var(--text-bright)}
nav button.active{color:var(--primary);border-left-color:var(--primary);background:rgba(88,166,255,.06)}

.content{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-width:640px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:500;color:var(--text-muted)}
.form-group textarea,.form-group input,.form-group select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-bright);padding:8px 10px;font-family:var(--font);font-size:13px;outline:none;resize:vertical}
.form-group textarea:focus,.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{min-height:72px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.form-group select{appearance:none;cursor:pointer}

.actions{display:flex;gap:8px;align-items:center}
button.generate{background:var(--primary-dim);color:#fff;border:none;border-radius:var(--radius);padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease}
button.generate:hover{background:var(--primary)}
button.generate:disabled{opacity:.4;cursor:not-allowed}
button.cancel{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;transition:opacity 150ms ease}
button.cancel:hover{opacity:.8}
button.cancel:disabled{opacity:.3;cursor:not-allowed}

.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;display:none}
.progress-bar.active{display:block}
.progress-bar .fill{height:100%;background:var(--primary);transition:width 200ms ease;width:0%}

.player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.player .label{font-size:12px;color:var(--text-muted)}
.player audio{width:100%;height:36px;border-radius:var(--radius)}
.player .duration{font-size:12px;color:var(--text-muted);text-align:right}

.log{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.log .label{font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.log pre{font-family:"SF Mono",Monaco,Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.6;color:var(--text-muted);max-height:140px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

.tab-content{display:none}
.tab-content.active{display:flex;flex-direction:column;gap:16px}

.form-group input[type="file"]{padding:6px 0;font-size:12px}
.form-group input[type="file"]::file-selector-button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:4px 10px;font-size:12px;cursor:pointer;margin-right:8px}

.model-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.model-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.model-card .card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
}
.model-card .card-desc {
  font-size: 12px;
  color: var(--text-muted);
}
.model-card .card-meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-muted);
}
.model-card .card-status {
  font-size: 12px;
  font-weight: 500;
}
.model-card .card-status.complete { color: #3fb950; }
.model-card .card-status.incomplete { color: #d29922; }
.model-card .card-status.missing { color: var(--accent); }
.model-card .card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.model-card .card-actions button {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  border: none;
  transition: opacity 150ms ease;
}
.model-card .card-actions button:hover { opacity: .85; }
.model-card .card-actions button.btn-dl {
  background: var(--primary-dim);
  color: #fff;
}
.model-card .card-actions button.btn-del {
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
}
.model-card .card-actions button.btn-cancel {
  background: none;
  border: 1px solid var(--text-muted);
  color: var(--text-muted);
}
.model-card .card-actions button:disabled { opacity: .4; cursor: not-allowed; }
.dl-progress {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  display: none;
}
.dl-progress.active { display: block; }
.dl-progress .fill {
  height: 100%;
  background: var(--primary);
  transition: width 300ms ease;
  width: 0%;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Qwen3-TTS</h1>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">连接中</span>
    </div>
  </header>
  <main>
    <nav id="tabs">
      <button class="active" data-tab="custom_voice">预设音色</button>
      <button data-tab="voice_design">语音设计</button>
      <button data-tab="voice_clone">声音克隆</button>
      <button data-tab="model_manage">模型管理</button>
    </nav>
    <div class="content">
      <div id="tab-custom_voice" class="tab-content active">
      <div class="form-group">
        <label>文本</label>
        <textarea id="cv-text" placeholder="请输入要合成的文本..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>语言</label>
          <select id="cv-language"></select>
        </div>
        <div class="form-group">
          <label>音色</label>
          <select id="cv-speaker"></select>
        </div>
      </div>
      <div class="form-group">
        <label>风格指令（可选）</label>
        <input type="text" id="cv-instruct" placeholder="例如：用温柔的语气说">
      </div>
      </div>

      <div id="tab-voice_design" class="tab-content">
        <div class="form-group">
          <label>文本</label>
          <textarea id="vd-text" placeholder="请输入要合成的文本..."></textarea>
        </div>
        <div class="form-group">
          <label>语言</label>
          <select id="vd-language"></select>
        </div>
        <div class="form-group">
          <label>音色描述</label>
          <textarea id="vd-instruct" rows="3" placeholder="例如：温暖友好的女声，略带回音"></textarea>
        </div>
      </div>

      <div id="tab-voice_clone" class="tab-content">
        <div class="form-group">
          <label>文本</label>
          <textarea id="vc-text" placeholder="请输入要合成的文本..."></textarea>
        </div>
        <div class="form-group">
          <label>语言</label>
          <select id="vc-language"></select>
        </div>
        <div class="form-group">
          <label>参考音频</label>
          <input type="file" id="vc-ref-audio" accept="audio/*">
        </div>
        <div class="form-group">
          <label>参考文本（可选）</label>
          <input type="text" id="vc-ref-text" placeholder="参考音频的文字内容">
        </div>
      </div>

      <div id="tab-model_manage" class="tab-content">
        <!-- 3 model cards will be rendered here by JS -->
      </div>

      <div class="actions">
        <button class="generate" id="btnGenerate" disabled>生成</button>
        <button class="cancel" id="btnCancel" disabled>取消</button>
      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

      <div class="player" id="playerSection" style="display:none">
        <div class="label">输出</div>
        <audio id="audioPlayer" controls></audio>
        <div class="duration" id="durationText"></div>
      </div>

      <div class="log">
        <div class="label">日志</div>
        <pre id="logOutput"></pre>
      </div>
    </div>
  </main>
</div>

<script>
const SAMPLE_RATE = 24000;
let ws = null;
let currentRequestId = null;
let isGenerating = false;
let audioCtx = null;
let pcmBuffers = [];
let playStartTime = 0;
let nextPlayOffset = 0;
let currentTab = 'custom_voice';
let speakers = [];
let languages = [];

const MODEL_NAMES = {
  'custom_voice': '预设音色',
  'voice_design': '语音设计',
  'base': '声音克隆',
};
let downloadPollInterval = null;

const LANG_ZH = {
  'Auto': '自动检测',
  'Chinese': '中文',
  'English': '英语',
  'Japanese': '日语',
  'Korean': '韩语',
  'German': '德语',
  'French': '法语',
  'Russian': '俄语',
  'Portuguese': '葡萄牙语',
  'Spanish': '西班牙语',
  'Italian': '意大利语',
};

const $ = id => document.getElementById(id);

function log(msg) {
  const el = $('logOutput');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(state, text) {
  const dot = $('statusDot');
  const label = $('statusText');
  dot.className = 'dot ' + (state === 'ok' ? 'ok' : state === 'loading' ? 'loading' : '');
  label.textContent = text;
}

function setGenerating(v) {
  isGenerating = v;
  $('btnGenerate').disabled = v;
  $('btnCancel').disabled = !v;
  $('progressBar').className = v ? 'progress-bar active' : 'progress-bar';
  if (v) {
    $('progressFill').style.width = '0%';
  }
}

function initAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playPcmChunk(int16Array) {
  if (!audioCtx) return;
  const float32 = new Float32Array(int16Array.length);
  for (let i = 0; i < int16Array.length; i++) {
    float32[i] = int16Array[i] / 32768;
  }
  pcmBuffers.push(float32);

  const buffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
  buffer.getChannelData(0).set(float32);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startTime = Math.max(now, nextPlayOffset);
  source.start(startTime);
  nextPlayOffset = startTime + buffer.duration;
}

function resetPlayback() {
  pcmBuffers = [];
  nextPlayOffset = 0;
  const player = $('audioPlayer');
  player.src = '';
  player.load();
  $('playerSection').style.display = 'none';
  $('durationText').textContent = '';
}

function buildWavFromBuffers() {
  let totalLen = 0;
  for (const b of pcmBuffers) totalLen += b.length;
  const merged = new Float32Array(totalLen);
  let offset = 0;
  for (const b of pcmBuffers) {
    merged.set(b, offset);
    offset += b.length;
  }

  const numSamples = merged.length;
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);

  function writeStr(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + numSamples * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, SAMPLE_RATE, true);
  view.setUint32(28, SAMPLE_RATE * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, numSamples * 2, true);

  for (let i = 0; i < numSamples; i++) {
    const s = Math.max(-1, Math.min(1, merged[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }

  const blob = new Blob([buffer], { type: 'audio/wav' });
  return URL.createObjectURL(blob);
}

async function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/tts`;
  log(`连接 ${url}`);
  setStatus('loading', '连接中');

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('ok', '已连接');
    $('btnGenerate').disabled = false;
    log('WebSocket 已连接');
  };

  ws.onclose = () => {
    setStatus('', '已断开');
    $('btnGenerate').disabled = true;
    log('WebSocket 已断开，3秒后重连...');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = err => {
    log('WebSocket 错误');
  };

  ws.onmessage = evt => {
    if (evt.data instanceof ArrayBuffer) {
      const int16 = new Int16Array(evt.data);
      playPcmChunk(int16);
      const totalSamples = pcmBuffers.reduce((s, b) => s + b.length, 0);
      const progress = Math.min(100, Math.round((totalSamples / SAMPLE_RATE) * 10));
      $('progressFill').style.width = progress + '%';
      return;
    }

    try {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
      case 'session.start':
        currentRequestId = msg.request_id;
        log(`生成开始: ${msg.request_id}`);
        break;
      case 'audio.done':
        setGenerating(false);
        $('progressFill').style.width = '100%';
        const wavUrl = buildWavFromBuffers();
        const player = $('audioPlayer');
        player.src = wavUrl;
        $('playerSection').style.display = '';
        $('durationText').textContent = `${msg.total_duration.toFixed(1)}秒`;
        log(`完成: ${msg.total_duration.toFixed(1)}秒, ${msg.chunks_sent} 个音频块`);
        break;
      case 'error':
        setGenerating(false);
        log(`错误: ${msg.message}`);
        break;
      case 'cancel.ack':
        log(`已取消: ${msg.request_id}`);
        break;
      }
    } catch (e) {
      log(`Parse error: ${e}`);
    }
  };
}

async function fetchJSON(path) {
  const r = await fetch(path);
  return r.json();
}

async function loadMetadata() {
  try {
    speakers = await fetchJSON('/v1/audio/speakers');
    languages = await fetchJSON('/v1/audio/languages');

    const langSelects = ['cv-language', 'vd-language', 'vc-language'];
    for (const id of langSelects) {
      const sel = $(id);
      sel.innerHTML = '';
      for (const l of languages) {
        const opt = document.createElement('option');
        opt.value = l; opt.textContent = LANG_ZH[l] || l;
        if (l === 'Auto') opt.selected = true;
        sel.appendChild(opt);
      }
    }

    const spkSel = $('cv-speaker');
    spkSel.innerHTML = '';
    for (const s of speakers) {
      const opt = document.createElement('option');
      opt.value = s.name; opt.textContent = `${s.name} — ${s.description_zh}`;
      if (s.name === 'Vivian') opt.selected = true;
      spkSel.appendChild(opt);
    }
  } catch (e) {
    log('加载元数据失败，使用默认值');
    const langSelects = ['cv-language', 'vd-language', 'vc-language'];
      const defaultLangs = ['Auto','Chinese','English','Japanese','Korean','German','French','Russian','Portuguese','Spanish','Italian'];
      for (const id of langSelects) {
        const sel = $(id);
        sel.innerHTML = '';
        for (const l of defaultLangs) {
          const opt = document.createElement('option');
          opt.value = l; opt.textContent = LANG_ZH[l] || l;
          sel.appendChild(opt);
        }
      }
    const spkSel = $('cv-speaker');
    spkSel.innerHTML = '<option value="Vivian">Vivian</option><option value="Ryan">Ryan</option>';
  }
}

async function loadModelStatus() {
  try {
    const models = await fetchJSON('/v1/models/status');
    renderModelCards(models);
    
    // Check if any model is downloading to start polling
    const anyDownloading = models.some(m => !m.complete && !m.exists && document.querySelector(`.dl-progress.active[data-model="${m.model_type}"]`)); // Very basic check, we'll refine in pollDownloadStatus
    
    // Let's just start polling if there's any incomplete/downloading
    pollDownloadStatus();
  } catch (e) {
    log('加载模型状态失败: ' + e.message);
  }
}

function renderModelCards(models) {
  const container = $('tab-model_manage');
  container.innerHTML = '';
  
  // Sort models according to MODEL_NAMES keys
  const order = ['custom_voice', 'voice_design', 'base'];
  models.sort((a, b) => order.indexOf(a.model_type) - order.indexOf(b.model_type));

  for (const m of models) {
    const isDownloading = m.status === 'downloading'; // If backend returned a status
    
    const card = document.createElement('div');
    card.className = 'model-card';
    card.id = `model-card-${m.model_type}`;
    
    let statusHTML = '';
    let actionsHTML = '';
    
    if (m.complete) {
      statusHTML = `<span class="card-status complete">✓ 已下载</span>`;
      actionsHTML = `<button class="btn-del" onclick="deleteModel('${m.model_type}')">删除</button>`;
    } else if (m.exists) {
      statusHTML = `<span class="card-status incomplete">⚠ 不完整 (缺 ${m.missing_files?.length || 0} 文件)</span>`;
      actionsHTML = `
        <button class="btn-dl" onclick="downloadModel('${m.model_type}')">继续下载</button>
        <button class="btn-del" onclick="deleteModel('${m.model_type}')">删除</button>
      `;
    } else {
      statusHTML = `<span class="card-status missing">✗ 未下载</span>`;
      actionsHTML = `<button class="btn-dl" onclick="downloadModel('${m.model_type}')">下载</button>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">${MODEL_NAMES[m.model_type] || m.model_type}</div>
        ${statusHTML}
      </div>
      <div class="card-desc">${m.description || ''}</div>
      <div class="card-meta">
        <span>大小: ${m.total_size_mb ? m.total_size_mb.toFixed(1) + ' MB' : '未知'}</span>
      </div>
      <div class="dl-progress" id="dl-prog-${m.model_type}" data-model="${m.model_type}">
        <div class="fill" id="dl-fill-${m.model_type}"></div>
      </div>
      <div class="card-actions" id="dl-actions-${m.model_type}">
        ${actionsHTML}
      </div>
    `;
    
    container.appendChild(card);
  }
}

async function downloadModel(modelType) {
  try {
    const res = await fetch(`/v1/models/${modelType}/download`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    
    // Update UI immediately to downloading state
    const cardHeader = document.querySelector(`#model-card-${modelType} .card-header`);
    if (cardHeader) {
       cardHeader.innerHTML = `
        <div class="card-title">${MODEL_NAMES[modelType]}</div>
        <span class="card-status incomplete" id="dl-status-text-${modelType}">下载中 (0%)</span>
       `;
    }
    
    const actions = $(`dl-actions-${modelType}`);
    if (actions) {
      actions.innerHTML = `<button class="btn-cancel" onclick="cancelDownload('${modelType}')">取消</button>`;
    }
    
    const prog = $(`dl-prog-${modelType}`);
    if (prog) {
      prog.classList.add('active');
      $(`dl-fill-${modelType}`).style.width = '0%';
    }

    pollDownloadStatus();
  } catch (e) {
    log(`下载模型 ${modelType} 失败: ${e.message}`);
  }
}

async function cancelDownload(modelType) {
  try {
    await fetch(`/v1/models/${modelType}/cancel-download`, { method: 'POST' });
    log(`已请求取消下载模型: ${modelType}`);
    setTimeout(loadModelStatus, 1000); // Reload after a bit
  } catch (e) {
    log(`取消下载失败: ${e.message}`);
  }
}

async function deleteModel(modelType) {
  if (!confirm(`确定要删除 ${MODEL_NAMES[modelType] || modelType} 模型文件吗？`)) return;
  
  try {
    const res = await fetch(`/v1/models/${modelType}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    log(`已删除模型: ${modelType}`);
    loadModelStatus();
  } catch (e) {
    log(`删除模型失败: ${e.message}`);
  }
}

async function pollDownloadStatus() {
  if (downloadPollInterval) return; // already polling

  downloadPollInterval = setInterval(async () => {
    // Only poll if tab is active, to save resources, but we need to keep tracking
    // For simplicity, poll all models that might be downloading
    try {
       const order = ['custom_voice', 'voice_design', 'base'];
       let anyDownloading = false;
       
       for (const modelType of order) {
         // Check if UI says it's downloading
         const prog = $(`dl-prog-${modelType}`);
         if (prog && prog.classList.contains('active')) {
           anyDownloading = true;
           try {
             const stat = await fetchJSON(`/v1/models/${modelType}/download-status`);
             if (stat.download_status === 'downloading') {
               $(`dl-fill-${modelType}`).style.width = `${stat.download_progress || 0}%`;
               const statusText = $(`dl-status-text-${modelType}`);
               if (statusText) statusText.textContent = `下载中 (${Math.round(stat.download_progress || 0)}%)`;
              } else if (stat.download_status === 'complete' || stat.model_complete) {
               // Done!
               loadModelStatus();
             } else if (stat.download_status === 'idle' || stat.download_status === 'error') {
               // Stopped or error
               loadModelStatus();
             }
           } catch(e) {}
         }
       }
       
       if (!anyDownloading) {
         clearInterval(downloadPollInterval);
         downloadPollInterval = null;
       }
    } catch(e) {
      clearInterval(downloadPollInterval);
      downloadPollInterval = null;
    }
  }, 2000);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('nav button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  
  if (tab === 'model_manage') {
    loadModelStatus();
  }
}


async function readAudioFileAsBase64(input) {
  if (!input.files || !input.files[0]) return null;
  const file = input.files[0];
  const buf = await file.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  return `data:${file.type};base64,${b64}`;
}

async function generate() {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log('未连接');
    return;
  }

  const text = $(currentTab === 'custom_voice' ? 'cv-text' : currentTab === 'voice_design' ? 'vd-text' : 'vc-text').value.trim();
  if (!text) { log('请先输入文本'); return; }

  initAudioContext();
  resetPlayback();
  setGenerating(true);

  const modelTypeMap = { custom_voice: 'custom_voice', voice_design: 'voice_design', voice_clone: 'base' };

  const msg = {
    type: 'generate',
    text,
    model_type: modelTypeMap[currentTab],
    language: $(currentTab === 'custom_voice' ? 'cv-language' : currentTab === 'voice_design' ? 'vd-language' : 'vc-language').value,
  };

  if (currentTab === 'custom_voice') {
    msg.speaker = $('cv-speaker').value;
    const inst = $('cv-instruct').value.trim();
    if (inst) msg.instruct = inst;
  } else if (currentTab === 'voice_design') {
    const inst = $('vd-instruct').value.trim();
    if (!inst) { log('请输入音色描述'); setGenerating(false); return; }
    msg.instruct = inst;
  } else if (currentTab === 'voice_clone') {
    const refB64 = await readAudioFileAsBase64($('vc-ref-audio'));
    if (!refB64) { log('请提供参考音频'); setGenerating(false); return; }
    msg.ref_audio = refB64;
    const rt = $('vc-ref-text').value.trim();
    if (rt) msg.ref_text = rt;
  }

  ws.send(JSON.stringify(msg));
}

function cancel() {
  if (currentRequestId && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cancel', request_id: currentRequestId }));
    setGenerating(false);
    resetPlayback();
    log('已请求取消');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadMetadata();
  connectWS();

  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  $('btnGenerate').addEventListener('click', generate);
  $('btnCancel').addEventListener('click', cancel);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isGenerating) cancel();
  });
});
</script>
